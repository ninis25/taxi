<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement réussi - NCP</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
    <style>
        .success-hero { text-align: center; padding: 4rem 2rem; max-width: 560px; margin: 0 auto; }
        .success-hero h1 { font-size: 1.75rem; margin-bottom: 1rem; color: var(--text-primary, #141414); }
        .success-hero p { color: var(--text-secondary, #6b7280); margin-bottom: 1.5rem; line-height: 1.6; }
        .success-hero .btn { display: inline-block; padding: 12px 24px; background: #b3123a; color: #fff; text-decoration: none; border-radius: 999px; font-weight: 600; margin-top: 0.5rem; }
        .success-hero .btn:hover { background: #8f0e2e; }
        .success-icon { font-size: 4rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="/" class="logo-link"><img src="/images/favicon_white.png" alt="NCP" class="logo-img"></a></div>
            <ul class="nav-menu">
                <li><a href="/">Accueil</a></li>
                <li><a href="/reservation">Réservation</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </div>
    </nav>
    <main class="success-hero">
        <div class="success-icon">✅</div>
        <h1>Paiement réussi</h1>
        <p>Merci pour votre réservation. Un email de confirmation et votre facture vous ont été envoyés.</p>
        <a href="/" class="btn">Retour à l'accueil</a>
        <br>
        <a href="/reservation" class="btn" style="background:#374151; margin-top:0.5rem;">Nouvelle réservation</a>
    </main>
</body>
</html>
